steps:
  - name: ghcr.io/astral-sh/uv:0.11.26-python3.11-bookworm-slim
    id: test
    entrypoint: sh
    args:
      - -c
      - uv sync --locked --group dev && uv run --locked --no-sync pytest tests/unit -q

  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/poke-math/poke-math:$COMMIT_SHA
      - --build-arg
      - COMMIT_SHA=$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/poke-math/poke-math:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - poke-math
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/poke-math/poke-math:$COMMIT_SHA
      - --region=${_REGION}
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: europe-west1
